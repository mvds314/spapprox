# Runs every script in examples/ after a merge into main. A release requires a successful run
# of this workflow on the released commit (see release.yml).

name: Examples

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  examples:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xdist matplotlib
        pip install -e ".[all]"
    - name: Run the examples
      run: |
        pytest -m examples -n auto
